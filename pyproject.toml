[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "common-crawl-bloom"
version = "0.1.0"
description = "Build RAM-resident Bloom filters from Common Crawl URL indexes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyarrow>=18,<26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cc-bloom = "common_crawl_bloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
